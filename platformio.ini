; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit PN532@^1.3.4
	knolleary/PubSubClient@^2.8
; WiFi and MQTT credentials — override these via build_flags below.
; Replace the placeholder values with your actual network settings.
build_flags =
    -DWIFI_SSID=\"YOUR_WIFI_SSID\"
    -DWIFI_PASSWORD=\"YOUR_WIFI_PASSWORD\"
    -DMQTT_BROKER=\"192.168.1.100\"
    -DDEVICE_ID=\"door-001\"

; Test configuration - runs unit tests only (no hardware required)
test_framework = unity
test_filter = unit/*
test_build_src = true

; Environment for embedded tests (requires hardware connected)
[env:esp32dev_embedded]
extends = env:esp32dev
test_filter = embedded/*